[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "curupira-lint"
version = "0.3.0"
description = "Linter local e rastreável para português técnico brasileiro."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
  { name = "Jorge Barreto" },
]
dependencies = []

[project.optional-dependencies]
nlp = [
  "spacy==3.8.15",
  "pt-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/pt_core_news_sm-3.8.0/pt_core_news_sm-3.8.0-py3-none-any.whl#sha256=c304fa04db3af73cd08a250feacf560506e15a2ec2469bd1b09f06847f6b455c",
]

[project.scripts]
curupira = "curupira_lint.cli:entrypoint"

[dependency-groups]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.1",
  "ruff==0.12.8",
]

[tool.uv]
required-version = "==0.11.14"

[tool.hatch.build.targets.wheel]
packages = ["src/curupira_lint", "src/hermes_lint"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Strings de fixture: parágrafos densos de propósito (lote difícil do estudo).
"tools/curupira/make_case_hard.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
