[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "hermes-lint"
version = "0.1.0"
description = "Linter local e rastreável para português técnico brasileiro."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
  { name = "Jorge Barreto" },
]
dependencies = []

[project.scripts]
hermes = "hermes_lint.cli:entrypoint"

[dependency-groups]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.1",
  "ruff==0.12.8",
]

[tool.uv]
required-version = "==0.11.14"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_lint"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
